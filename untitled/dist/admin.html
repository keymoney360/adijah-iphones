<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adijah Admin AUTO LIVE</title>
<style>
:root{--orange:#ff6600;--bg:#0f0f0f;--card:#1e1e1e;--border:#333}
body{background:var(--bg);color:#fff;font-family:system-ui;padding:15px;max-width:900px;margin:auto}
h1{color:var(--orange);text-align:center;margin:10px 0}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin:12px 0}
input,select{width:100%;padding:12px;margin:8px 0 12px;border-radius:8px;border:1px solid var(--border);background:#000;color:#fff;box-sizing:border-box}
button{padding:12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.btn-orange{background:var(--orange);color:#fff;width:100%}
.btn-red{background:#ff3333;color:#fff;padding:6px 12px;font-size:12px;border-radius:6px}
.product-row{display:flex;gap:10px;align-items:center;background:#000;padding:10px;border-radius:8px;margin:8px 0}
.product-row img{width:60px;height:60px;object-fit:cover;border-radius:8px}
#preview{width:100%;max-height:200px;object-fit:contain;display:none;border-radius:8px;margin:10px 0;border:1px solid var(--orange)}
.hidden{display:none}
#status{color:#25D366;text-align:center;font-weight:bold;margin-top:10px}
</style>
</head>
<body>
<h1>ADIJAH <span style="color:#ff6600">ADMIN AUTO</span></h1>

<div id="login" class="panel">
  <h3>Login</h3>
  <input type="password" id="pass" placeholder="adijah2024">
  <button class="btn-orange" onclick="checkPass()">Login</button>
  <p style="color:#888;font-size:12px">Password: adijah2024 (or leave empty)</p>
</div>

<div id="adminPanel" class="hidden">
  <div class="panel">
    <h3 style="color:var(--orange)">➕ Add New Phone - AUTO LIVE</h3>
    <label>Phone Name</label>
    <input type="text" id="pName" placeholder="e.g. iPhone 15 Pro Max 256GB">
    <label>Price KSh</label>
    <input type="number" id="pPrice" placeholder="e.g. 185000">
    <label>Category</label>
    <select id="pCat">
      <option value="iphones">iPhones</option>
      <option value="tablets">Tablets</option>
      <option value="watches">Watches</option>
      <option value="phones">Other Phones</option>
    </select>
    <label>📸 Upload Photo (under 800KB)</label>
    <input type="file" id="pFile" accept="image/*" onchange="previewFile()">
    <img id="preview">
    <label>Or Paste Image URL</label>
    <input type="text" id="pImage" placeholder="https://...">
    <button class="btn-orange" onclick="addProduct()">✅ PUBLISH LIVE NOW</button>
    <div id="status"></div>
  </div>

  <div class="panel">
    <h3>📱 LIVE Shop Products (<span id="count">0</span>)</h3>
    <div id="productList">Loading...</div>
  </div>
  <a href="./" target="_blank"><button class="btn-orange" style="background:#333">👀 View Live Shop</button></a>
</div>

<script>
const API = '/api/products';
let uploadedBase64 = "";

function previewFile(){
  const file = document.getElementById('pFile').files[0];
  if(!file) return;
  if(file.size > 800000){ alert('Image too big! Use <800KB. Compress photo.'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    uploadedBase64 = e.target.result;
    const img = document.getElementById('preview');
    img.src = e.target.result;
    img.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function checkPass(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('adminPanel').classList.remove('hidden');
  renderList();
}

async function getProducts(){
  try{
    const res = await fetch(API);
    return await res.json();
  }catch(e){
    return [];
  }
}

async function saveProducts(products){
  await fetch(API, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(products)
  });
  renderList();
}

async function renderList(){
  const products = await getProducts();
  document.getElementById('count').innerText = products.length;
  let html = '';
  products.forEach((p,i)=>{
    html += `<div class="product-row">
      <img src="${p.image}" onerror="this.src='https://via.placeholder.com/60'">
      <div style="flex:1"><b>${p.name}</b><br><span style="color:var(--orange)">KSh ${Number(p.price).toLocaleString()}</span><br><small>${p.category}</small></div>
      <button class="btn-red" onclick="deleteProduct(${i})">X</button>
    </div>`;
  });
  document.getElementById('productList').innerHTML = html || 'No products yet';
}

async function addProduct(){
  const name = document.getElementById('pName').value.trim();
  const price = parseInt(document.getElementById('pPrice').value);
  const cat = document.getElementById('pCat').value;
  const link = document.getElementById('pImage').value.trim();
  const finalImage = uploadedBase64 || link || "https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=500";
  if(!name ||!price){ alert('Enter Name & Price'); return; }
  document.getElementById('status').innerText = 'Publishing LIVE...';
  const products = await getProducts();
  products.unshift({ id: Date.now(), name, price, category: cat, image: finalImage });
  await saveProducts(products);
  document.getElementById('status').innerText = '✅ LIVE! Customer can see it now!';
  document.getElementById('pName').value=''; document.getElementById('pPrice').value='';
  document.getElementById('pImage').value=''; document.getElementById('pFile').value='';
  document.getElementById('preview').style.display='none'; uploadedBase64='';
  setTimeout(()=>document.getElementById('status').innerText='',3000);
}

async function deleteProduct(i){
  if(!confirm('Delete from LIVE shop?')) return;
  const products = await getProducts();
  products.splice(i,1);
  await saveProducts(products);
}

renderList();
</script>
</body>
</html>
