<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adijah Admin Panel</title>
<style>
  :root{--orange:#ff6600;--bg:#121212;--card:#1e1e1e;--border:#333}
  body{background:var(--bg);color:#fff;font-family:Segoe UI,sans-serif;padding:20px;max-width:900px;margin:auto}
  h1{color:var(--orange);text-align:center;margin:20px 0}
  .login-box,.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
  input,select{width:100%;padding:12px;margin:8px 0 15px 0;border-radius:8px;border:1px solid var(--border);background:#000;color:#fff}
  button{padding:12px 20px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
  .btn-orange{background:var(--orange);color:#000;width:100%}
  .btn-green{background:#25D366;color:#fff;width:100%;margin-top:10px}
  .btn-red{background:#ff3333;color:#fff;padding:6px 12px;font-size:12px}
  .product-row{display:flex;gap:10px;align-items:center;background:#000;padding:10px;border-radius:8px;margin:8px 0}
  .product-row img{width:60px;height:60px;object-fit:cover;border-radius:8px}
  .product-row div{flex:1}
  #exportCode{background:#000;color:#0f0;padding:15px;border-radius:8px;white-space:pre-wrap;word-break:break-all;font-family:monospace;font-size:12px;max-height:300px;overflow:auto;margin-top:15px;border:1px solid var(--orange)}
  .hidden{display:none}
</style>
</head>
<body>
<h1>ADIJAH <span style="color:#ff6600">ADMIN</span></h1>

<div id="login" class="login-box">
  <h3>Enter Admin Password</h3>
  <input type="password" id="pass" placeholder="Password">
  <button class="btn-orange" onclick="checkPass()">Login</button>
  <p style="color:#888;font-size:12px;margin-top:10px">Default: adijah2024</p>
</div>

<div id="adminPanel" class="hidden">
  <div class="panel">
    <h3 style="color:var(--orange)">➕ Add New Phone</h3>
    <label>Phone Name</label>
    <input type="text" id="pName" placeholder="iPhone 13 Pro Max 256GB">
    <label>Price in KSh</label>
    <input type="number" id="pPrice" placeholder="85000">
    <label>Category</label>
    <select id="pCat">
      <option value="iphones">iPhones</option>
      <option value="tablets">Tablets</option>
      <option value="watches">Watches</option>
      <option value="phones">Other Phones</option>
    </select>
    <label>Image Link</label>
    <input type="text" id="pImage" placeholder="https://...">
    <button class="btn-orange" onclick="addProduct()">Add Phone to Shop</button>
  </div>

  <div class="panel">
    <h3>📱 Current Phones (<span id="count">0</span>)</h3>
    <div id="productList"></div>
  </div>

  <div class="panel">
    <h3 style="color:#25D366">🚀 Publish to Live Website</h3>
    <p style="color:#aaa;font-size:13px">1. Click Generate<br>2. Copy<br>3. Paste in GitHub index.html → fetchProducts() <br>4. Commit</p>
    <button class="btn-green" onclick="generateExport()">Generate Code for GitHub</button>
    <div id="exportCode">Click Generate to see code...</div>
    <button class="btn-orange" style="margin-top:15px" onclick="copyCode()">📋 Copy Code</button>
    <a href="/" target="_blank"><button class="btn-green" style="background:#555">👀 View Live Shop</button></a>
  </div>
</div>

<script>
const DEFAULT_PRODUCTS = [
  { id: 1, name: "iPhone 15 Pro Max 256GB", price: 185000, category: "iphones", image: "https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=500" },
  { id: 2, name: "iPhone 15 Pro 128GB", price: 165000, category: "iphones", image: "https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=500" },
  { id: 3, name: "iPhone 14 Pro Max 256GB", price: 155000, category: "iphones", image: "https://images.unsplash.com/photo-1678911820864-e2c567c655d7?w=500" },
  { id: 4, name: "iPhone 14 128GB", price: 115000, category: "iphones", image: "https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=500" },
  { id: 5, name: "iPhone 13 128GB", price: 85000, category: "iphones", image: "https://images.unsplash.com/photo-1632661674596-d8441a0dd2a8?w=500" },
  { id: 6, name: "iPad Pro 12.9 M2", price: 145000, category: "tablets", image: "https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?w=500" },
  { id: 7, name: "Apple Watch Series 9", price: 55000, category: "watches", image: "https://images.unsplash.com/photo-1555421689-3f034debb7a6?w=500" },
  { id: 8, name: "Samsung S24 Ultra", price: 135000, category: "phones", image: "https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=500" }
];
function getProducts(){let s=localStorage.getItem('adijah_products');return s?JSON.parse(s):DEFAULT_PRODUCTS}
function saveProducts(p){localStorage.setItem('adijah_products',JSON.stringify(p));renderList()}
function checkPass(){if(document.getElementById('pass').value==='adijah2024'){document.getElementById('login').classList.add('hidden');document.getElementById('adminPanel').classList.remove('hidden');renderList()}else alert('Wrong password!')}
function renderList(){let products=getProducts();document.getElementById('count').innerText=products.length;let html='';products.forEach((p,i)=>{html+=`<div class="product-row"><img src="${p.image}"><div><b>${p.name}</b><br><span style="color:#ff6600">KSh ${p.price.toLocaleString()}</span> - ${p.category}</div><button class="btn-red" onclick="deleteProduct(${i})">Delete</button></div>`});document.getElementById('productList').innerHTML=html||'No products'}
function addProduct(){let name=document.getElementById('pName').value.trim();let price=parseInt(document.getElementById('pPrice').value);let cat=document.getElementById('pCat').value;let img=document.getElementById('pImage').value.trim()||'https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=500';if(!name||!price){alert('Enter Name and Price!');return}let products=getProducts();products.unshift({id:Date.now(),name,price,category:cat,image:img});saveProducts(products);document.getElementById('pName').value='';document.getElementById('pPrice').value='';document.getElementById('pImage').value='';alert('Added! Now Generate Code.')}
function deleteProduct(i){if(!confirm('Delete?'))return;let products=getProducts();products.splice(i,1);saveProducts(products)}
function generateExport(){let products=getProducts();let code="allProducts = [\n";products.forEach(p=>{code+=`  { id: ${p.id}, name: "${p.name.replace(/"/g,'\\"')}", price: ${p.price}, category: "${p.category}", image: "${p.image}" },\n`});code+="];\nrenderProducts(allProducts);";document.getElementById('exportCode').innerText=code}
function copyCode(){let t=document.getElementById('exportCode').innerText;navigator.clipboard.writeText(t).then(()=>alert('Copied! Paste in GitHub.'))}
</script>
</body>
</html>
